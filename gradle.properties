# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx5G
org.gradle.parallel=true
org.gradle.caching=true

# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21
parchment_mappings_version=2024.11.10
minecraft_version=1.21.1
fabric_version=0.114.0+1.21.1
loader_version=0.16.10

# Mod options
mod_id=sophisticatedfabriccompat
mod_name=Sophisticated Fabric Compatibility
mod_version=1.0.0
mod_group_id=org.github.salandora
mod_license=GNU General Public License v3.0
mod_description=A mod to add compatibility for other mods for the unofficial fabric version of the Sophisticated Mods
mod_display_url=https://www.curseforge.com/minecraft/mc-mods/sophisticated-fabric-compatibility
mod_issue_tracker_url=https://github.com/Salandora/SophisticatedFabricCompatibility/issues
mod_sources_url=https://github.com/Salandora/SophisticatedFabricCompatibility
github_package_url=https://maven.pkg.github.com/Salandora/SophisticatedFabricCompatibility

#publish
curseforge_id=
modrinth_project_id=
release_type=release
release_versions=1.21.1

# Dependencies
# If set to "none" we use the version provided by fabric loader
mixin_extras_version = 0.5.0-beta.3

# Night-Config
nightconfig_version=3.8.1

# Compat
sc_version=[1.21.1-1.2.9.1,1.22)
sb_version=[1.21.1-3.23.4.1,1.22)
ss_version=[1.21.1-1.3.7.1,1.22)

# Litematica
# https://modrinth.com/mod/malilib/versions?g=1.21.1
malilib_version=0.21.7
# https://modrinth.com/mod/litematica/versions?g=1.21.1
litematica_version=0.19.57
# https://modrinth.com/mod/trinkets/versions?g=1.21.1&l=fabric
trinkets_version=3.10.0

# AudioPlayer
# https://modrinth.com/mod/audioplayer/versions?l=fabric&g=1.21.1
audioplayer_version=fabric-1.21.1-1.12.0
# https://modrinth.com/plugin/simple-voice-chat/versions?l=fabric&g=1.21.1
simple_voice_chat_version=fabric-1.21.1-2.5.24
# https://modrinth.com/mod/admiral/versions?l=fabric&g=1.21.1
admiral_version=0.4.6+1.21.1+fabric